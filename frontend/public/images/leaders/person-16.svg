<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="g_person-16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005c97" />
      <stop offset="100%" stop-color="#363795" />
    </linearGradient>

    <!-- Metallic Gold/Accent Gradient -->
    <linearGradient id="acc_person-16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#81ecec" />
      <stop offset="100%" stop-color="#005c97" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow_person-16" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Mask for Silhouette clipping -->
    <clipPath id="circle_clip_person-16">
      <circle cx="60" cy="60" r="54" />
    </clipPath>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#81ecec" stroke-width="1.5" opacity="0.35" />

  <!-- Base Circle with Gradient -->
  <circle cx="60" cy="60" r="55" fill="url(#g_person-16)" />

  <!-- Subtle Architectural Geo Lines in BG -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.8">
    <circle cx="60" cy="60" r="42" fill="none" />
    <circle cx="60" cy="60" r="28" fill="none" />
    <line x1="20" y1="20" x2="100" y2="100" />
    <line x1="20" y1="100" x2="100" y2="20" />
  </g>

  <!-- Clipped Silhouette -->
  <g clip-path="url(#circle_clip_person-16)">
    
      <!-- Head / Hair -->
      <ellipse cx="60" cy="46" rx="17" ry="20" fill="url(#g_person-16)" opacity="0.95" />
      <path d="M43 46 C41 33 49 22 60 22 C71 22 79 33 77 46 C77 56 73 63 60 63 C47 63 43 56 43 46 Z" fill="#ffffff" opacity="0.9" />
      <path d="M41 42 C40 32 46 20 60 20 C74 20 80 32 79 42 C79 50 76 56 73 60 C78 52 77 34 68 28 C61 24 53 26 49 32 C46 36 43 45 44 58 C42 53 41 47 41 42 Z" fill="#81ecec" opacity="0.6" />
      
      <!-- Neck & Collar / Dress -->
      <path d="M54 62 L66 62 L69 72 L51 72 Z" fill="#ffffff" opacity="0.85" />
      <path d="M30 106 C30 84 42 74 53 73 L60 84 L67 73 C78 74 90 84 90 106 Z" fill="#ffffff" opacity="0.92" />
      <path d="M53 73 L60 84 L67 73 L60 76 Z" fill="#81ecec" />
      <circle cx="60" cy="80" r="2.5" fill="#ffffff" />
        
  </g>

  <!-- Polished Double Outer Border -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#acc_person-16)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.4" />

  <!-- Monogram Pill at bottom right -->
  <g transform="translate(76, 76)">
    <circle cx="16" cy="16" r="15" fill="#071726" stroke="#81ecec" stroke-width="1.8" filter="url(#glow_person-16)" />
    <circle cx="16" cy="16" r="13" fill="url(#g_person-16)" opacity="0.85" />
    <text x="16" y="20.5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="0.5">MT</text>
  </g>
</svg>
