<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="g_person-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>

    <!-- Metallic Gold/Accent Gradient -->
    <linearGradient id="acc_person-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow_person-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Mask for Silhouette clipping -->
    <clipPath id="circle_clip_person-5">
      <circle cx="60" cy="60" r="54" />
    </clipPath>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#00d2d3" stroke-width="1.5" opacity="0.35" />

  <!-- Base Circle with Gradient -->
  <circle cx="60" cy="60" r="55" fill="url(#g_person-5)" />

  <!-- Subtle Architectural Geo Lines in BG -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.8">
    <circle cx="60" cy="60" r="42" fill="none" />
    <circle cx="60" cy="60" r="28" fill="none" />
    <line x1="20" y1="20" x2="100" y2="100" />
    <line x1="20" y1="100" x2="100" y2="20" />
  </g>

  <!-- Clipped Silhouette -->
  <g clip-path="url(#circle_clip_person-5)">
    
      <!-- Head -->
      <ellipse cx="60" cy="44" rx="16" ry="19" fill="#ffffff" opacity="0.92" />
      <!-- Hair accent -->
      <path d="M44 41 C44 28 50 22 60 22 C70 22 76 28 76 41 C76 34 72 26 60 26 C48 26 44 34 44 41 Z" fill="#00d2d3" opacity="0.75" />
      
      <!-- Collar & Neck -->
      <path d="M54 60 L66 60 L68 70 L52 70 Z" fill="#ffffff" opacity="0.85" />
      <!-- Suit Shoulders -->
      <path d="M28 106 C28 85 40 73 52 71 L60 88 L68 71 C80 73 92 85 92 106 Z" fill="#ffffff" opacity="0.92" />
      <!-- Tie -->
      <polygon points="58,72 62,72 64,88 60,94 56,88" fill="#00d2d3" />
      <!-- Lapel V-Cut -->
      <path d="M52 71 L60 88 L46 106 M68 71 L60 88 L74 106" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" fill="none" />
        
  </g>

  <!-- Polished Double Outer Border -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#acc_person-5)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.4" />

  <!-- Monogram Pill at bottom right -->
  <g transform="translate(76, 76)">
    <circle cx="16" cy="16" r="15" fill="#071726" stroke="#00d2d3" stroke-width="1.8" filter="url(#glow_person-5)" />
    <circle cx="16" cy="16" r="13" fill="url(#g_person-5)" opacity="0.85" />
    <text x="16" y="20.5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="0.5">HA</text>
  </g>
</svg>
