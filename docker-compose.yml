name: ${COMPOSE_PROJECT_NAME:-investiq}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-investiq}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-investiq}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-true}
  NEWS_INGESTION_MAX_AGE_HOURS: ${NEWS_INGESTION_MAX_AGE_HOURS:-2160}
  NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-90}
  NEWS_PROVIDER_REQUESTS_PER_MINUTE: ${NEWS_PROVIDER_REQUESTS_PER_MINUTE:-30}
  NEWS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${NEWS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
  NEWS_PROVIDER_CIRCUIT_OPEN_SECONDS: ${NEWS_PROVIDER_CIRCUIT_OPEN_SECONDS:-120}
  MARKET_DATA_MODE: ${MARKET_DATA_MODE:-disabled}
  MARKET_PUBLIC_CACHE_SECONDS: ${MARKET_PUBLIC_CACHE_SECONDS:-30}
  VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
  VNSTOCK_REFRESH_SECONDS: ${VNSTOCK_REFRESH_SECONDS:-60}
  VNSTOCK_CANDLE_CACHE_SECONDS: ${VNSTOCK_CANDLE_CACHE_SECONDS:-300}
  VNSTOCK_FUNDAMENTAL_CACHE_SECONDS: ${VNSTOCK_FUNDAMENTAL_CACHE_SECONDS:-3600}
  VNSTOCK_MAX_SYMBOLS: ${VNSTOCK_MAX_SYMBOLS:-1800}
  TCBS_API_BASE_URL: ${TCBS_API_BASE_URL:-https://openapi.tcbs.com.vn}
  TCBS_WS_URL: ${TCBS_WS_URL:-wss://openapi.tcbs.com.vn/ws/thesis/v1/stream/normal}
  TCBS_API_KEY: ${TCBS_API_KEY:-}
  TCBS_OTP: ${TCBS_OTP:-}
  TCBS_ACCESS_TOKEN: ${TCBS_ACCESS_TOKEN:-}
  TCBS_REQUEST_TIMEOUT_SECONDS: ${TCBS_REQUEST_TIMEOUT_SECONDS:-5}
  TCBS_QUOTE_REFRESH_SECONDS: ${TCBS_QUOTE_REFRESH_SECONDS:-3}
  TCBS_SECURITY_REFRESH_SECONDS: ${TCBS_SECURITY_REFRESH_SECONDS:-21600}
  TCBS_HTTP_RETRY_ATTEMPTS: ${TCBS_HTTP_RETRY_ATTEMPTS:-3}
  TCBS_CIRCUIT_FAILURE_THRESHOLD: ${TCBS_CIRCUIT_FAILURE_THRESHOLD:-5}
  TCBS_CIRCUIT_OPEN_SECONDS: ${TCBS_CIRCUIT_OPEN_SECONDS:-30}
  NEWS_ADMIN_TOKEN: ${NEWS_ADMIN_TOKEN:-}
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  AUTH_BFF_SECRET: ${AUTH_BFF_SECRET:-}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
  AUTH_JWT_PREVIOUS_SECRET: ${AUTH_JWT_PREVIOUS_SECRET:-}
  AUTH_OTP_HMAC_KEY: ${AUTH_OTP_HMAC_KEY:-}
  AUTH_PAYLOAD_ENCRYPTION_KEY: ${AUTH_PAYLOAD_ENCRYPTION_KEY:-}
  AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
  AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-}
  AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
  AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
  AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
  AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
  AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
  AUTH_SMTP_STARTTLS: ${AUTH_SMTP_STARTTLS:-true}

x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:-investiq-backend:local}
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  labels:
    com.investiq.logs: "true"
  logging: *default-logging
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investiq}
      POSTGRES_USER: ${POSTGRES_USER:-investiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    labels:
      com.investiq.logs: "true"
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend
    labels:
      com.investiq.logs: "true"
    logging: *default-logging
    restart: unless-stopped

  backend:
    <<: *backend-service
    environment:
      <<: *backend-environment
      SERVICE_NAME: backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      - edge
      - market-egress

  celery-worker:
    <<: *backend-service
    environment:
      <<: *backend-environment
      SERVICE_NAME: celery-worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}", "--queues=news-ingestion,celery"]
    networks:
      - backend
      - news-egress
    stop_grace_period: 30s

  celery-notifications:
    <<: *backend-service
    environment:
      <<: *backend-environment
      SERVICE_NAME: celery-notifications
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=notifications"]
    networks:
      - backend
      - mail-egress
    stop_grace_period: 30s

  celery-beat:
    <<: *backend-service
    environment:
      <<: *backend-environment
      SERVICE_NAME: celery-beat
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    image: ${FRONTEND_IMAGE:-investiq-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_LOG_VIEWER_URL: ${NEXT_PUBLIC_LOG_VIEWER_URL:-http://localhost:9999}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_BASE_URL: http://backend:8000/api
      NEWS_ADMIN_TOKEN: ${NEWS_ADMIN_TOKEN:-}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      AUTH_BFF_SECRET: ${AUTH_BFF_SECRET:-}
      AUTH_SESSION_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/3
      AUTH_SESSION_ENCRYPTION_KEY: ${AUTH_SESSION_ENCRYPTION_KEY:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - edge
    labels:
      com.investiq.logs: "true"
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge
    labels:
      com.investiq.logs: "true"
    logging: *default-logging
    restart: unless-stopped

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls96@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    environment:
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "1"
      ALLOW_TOP: "0"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      LOG_LEVEL: warning
      PING: "1"
      POST: "0"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  log-viewer:
    image: amir20/dozzle:v11.1.1@sha256:c90494cbc3a9ca959634b89fdb3fdecbcbae1f690d7a567d0d356c6fda1d957c
    environment:
      DOZZLE_AUTH_PROVIDER: none
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_FILTER: label=com.investiq.logs=true
      DOZZLE_HOSTNAME: InvestIQ local
      DOZZLE_IMAGE_CHECK_MODE: "off"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_REMOTE_HOST: tcp://docker-socket-proxy:2375
    ports:
      - "127.0.0.1:${LOG_VIEWER_PORT:-9999}:8080"
    volumes:
      - log-viewer-data:/data
      - ./infra/log-viewer/profile.json:/data/__default__/profile.json:ro
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability
      - log-viewer-edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  log-viewer-data:

networks:
  backend:
    internal: true
  mail-egress:
  news-egress:
  market-egress:
  edge:
  observability:
    internal: true
  log-viewer-edge:
