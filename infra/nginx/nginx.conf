user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    map $status $investiq_log_level {
        ~^2 info;
        ~^3 info;
        ~^4 warn;
        ~^5 error;
        default info;
    }

    map $status $investiq_log_problem {
        ~^2 "Request completed successfully.";
        ~^3 "Request was redirected; verify the destination when unexpected.";
        ~^4 "The client request was rejected; check its URL, input, or permissions.";
        ~^5 "The server failed to complete the request; inspect the upstream service.";
        default "Non-standard HTTP result; inspect the full log entry.";
    }

    map $http_x_request_id $investiq_request_id {
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
        default $request_id;
    }

    log_format investiq_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"$investiq_log_level",'
        '"message":"$request_method $uri completed with HTTP $status",'
        '"code":$status,'
        '"api_url":"$uri",'
        '"log_content":"$request_method $uri completed in $request_time seconds",'
        '"logged_at":"$time_iso8601",'
        '"container":"nginx",'
        '"problem":"$investiq_log_problem",'
        '"request_id":"$investiq_request_id",'
        '"duration_seconds":$request_time}';

    access_log /dev/stdout investiq_json;
    error_log /dev/stderr warn;

    upstream investiq_frontend {
        server frontend:3000;
    }

    upstream investiq_backend {
        server backend:8000;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://investiq_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $investiq_request_id;
        }

        location /ws/ {
            proxy_pass http://investiq_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $investiq_request_id;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://investiq_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $investiq_request_id;
        }
    }
}
