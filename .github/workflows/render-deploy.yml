name: CI/CD Pipeline to Render

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: render-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff (Linter & Formatter Check)
        working-directory: backend
        run: ruff check .

      - name: Run Mypy (Static Type Check)
        working-directory: backend
        run: mypy

      - name: Run Unit Tests (Pytest)
        working-directory: backend
        run: python -m pytest tests/unit/ -v --dist=loadfile -n auto --timeout=120 --durations=20

  ci-frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Modules
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        working-directory: frontend
        run: npm test

  migrate-database:
    name: Apply Database Migrations
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Trannguyen08/investiq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Database Driver
        run: pip install psycopg[binary]

      - name: Run Forward Migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "Bắt đầu áp dụng migration lên Cloud Database..."
            python -m app.infrastructure.db.base
          else
            echo "DATABASE_URL secret không được cấu hình trong GitHub Secrets, bỏ qua bước migration tự động."
          fi

  deploy-to-render:
    name: Trigger Render Deployment
    needs: [migrate-database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Trannguyen08/investiq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Backend Deploy
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "Gửi tín hiệu deploy Backend tới Render qua Deploy Hook..."
            curl -f -X POST "$BACKEND_HOOK"
            echo "Đã kích hoạt Backend Deploy thành công."
          elif [ -n "$RENDER_API_KEY" ]; then
            echo "Gửi tín hiệu deploy Backend tới Render qua REST API..."
            curl -f -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{"clearCache":"clear"}' https://api.render.com/v1/services/srv-dbdn1s8473hc73cuqp4g/deploys
            echo "Đã kích hoạt Backend Deploy qua REST API thành công."
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK hoặc RENDER_API_KEY không có, Render sẽ tự động build từ commit push nhánh main."
          fi

      - name: Deploy Summary
        run: |
          echo "Pipeline CI/CD hoàn tất! Các thay đổi đã được kiểm tra và kích hoạt triển khai."
