name: CI/CD Pipeline to Render

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: render-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff (Linter & Formatter Check)
        working-directory: backend
        run: ruff check .

      - name: Run Mypy (Static Type Check)
        working-directory: backend
        run: mypy

      - name: Run Unit Tests (Pytest)
        working-directory: backend
        run: python -m pytest tests/unit/ -v

  ci-frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Modules
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        working-directory: frontend
        run: npm test

  migrate-database:
    name: Apply Database Migrations
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Trannguyen08/investiq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Database Driver
        run: pip install psycopg[binary]

      - name: Run Forward Migrations
        working-directory: backend
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: |
          echo "Bắt đầu áp dụng migration lên Cloud Database..."
          python -m app.infrastructure.db.base

  deploy-to-render:
    name: Trigger Render Deployment
    needs: [migrate-database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Trannguyen08/investiq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Backend Deploy
        if: env.BACKEND_HOOK != ''
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Gửi tín hiệu deploy Backend tới Render..."
          curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo "Đã kích hoạt Backend Deploy thành công."

      - name: Trigger Frontend Deploy
        if: env.FRONTEND_HOOK != ''
        env:
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Gửi tín hiệu deploy Frontend tới Render..."
          curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo "Đã kích hoạt Frontend Deploy thành công."

      - name: Deploy Summary
        run: |
          echo "Pipeline CI/CD hoàn tất! Các thay đổi đã được kiểm tra và kích hoạt triển khai."
