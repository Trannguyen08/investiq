name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  verify-backend:
    uses: ./.github/workflows/backend-ci.yml

  verify-frontend:
    uses: ./.github/workflows/frontend-ci.yml

  publish:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Derive image names
        id: meta
        shell: bash
        run: |
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/backend:staging
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/frontend:staging
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, investiq-staging]
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy immutable images
        env:
          APP_ENV: staging
          BACKEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/backend:${{ needs.publish.outputs.image_tag }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/frontend:${{ needs.publish.outputs.image_tag }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '8080' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          LOG_VIEWER_PORT: ${{ vars.LOG_VIEWER_PORT || '9999' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'investiq' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'investiq' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker compose pull
          docker compose up --detach --no-build --remove-orphans --wait --wait-timeout 180
