name: Backend CI

on:
  workflow_call:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type-check
        working-directory: backend
        run: mypy

      - name: Test
        working-directory: backend
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing

      - name: Build backend image
        run: docker build --tag investiq-backend:ci backend

      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
        run: docker compose config --quiet
